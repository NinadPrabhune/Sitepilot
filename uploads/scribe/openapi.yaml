  /api/auth/refresh:
    post:
      summary: 'Refresh API Token'
      operationId: refreshAPIToken
      description: "Invalidate the current token and generate a new one.\nReturns the new token along with user profile, workspaces, and sites.\nThe new token replaces the old one — the old token will no longer work."
      parameters: []
      responses:
        200:
          description: Success
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"status\": 1,\n  \"data\": {\n    \"token\": \"1|newtokensring...\",\n    \"refresh_expires_in\": null,\n    \"expires_unit\": \"none\",\n    \"user\": { \"id\": 1, \"name\": \"John Doe\", \"email\": \"john@example.com\", ... },\n    \"workspaces\": [...],\n    \"sites\": [...]\n  }\n}"
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Token cannot be refreshed or something went wrong'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Token cannot be refreshed or something went wrong'
      tags:
        - Authentication
  /api/change-password:
    post:
      summary: 'Change Password'
      operationId: changePassword
      description: "Update the authenticated user's password.\nRequires the current password for verification.\nThe new password must be different from the current one."
      parameters: []
      responses:
        200:
          description: 'Password updated successfully'
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"status\": 1,\n  \"message\": \"password updated successfully.\",\n  \"data\": { \"id\": 1, \"name\": \"John Doe\", \"email\": \"john@example.com\", ... }\n}"
        400:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'The password field is required.'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'The password field is required.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Current password mismatch'
                    type: object
                    example:
                      message: 'The provided current password does not match our records.'
                    properties:
                      message:
                        type: string
                        example: 'The provided current password does not match our records.'
                  -
                    description: 'New password same as old'
                    type: object
                    example:
                      message: 'The provided password and old password are same.'
                    properties:
                      message:
                        type: string
                        example: 'The provided password and old password are same.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'Current password for verification.'
                  example: oldpass123
                password:
                  type: string
                  description: 'New password (must be confirmed).'
                  example: newpass456
                password_confirmation:
                  type: string
                  description: 'Must match the new password.'
                  example: newpass456
              required:
                - current_password
                - password
                - password_confirmation
  /api/forgot-password:
    post:
      summary: 'Send Password Reset Link'
      operationId: sendPasswordResetLink
      description: "Send a password reset link to the user's registered email address.\nThe link is valid for the duration configured in Laravel's password broker."
      parameters: []
      responses:
        200:
          description: 'Reset link sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 1
                  message: 'Reset link sent to your email.'
                properties:
                  status:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: 'Reset link sent to your email.'
        422:
          description: 'Invalid or missing email'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Unable to send reset link.'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Unable to send reset link.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'User email address.'
                  example: john@example.com
              required:
                - email
  /api/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Reset the user's password using the token received via email.\nThe token is sent when calling the forgot-password endpoint."
      parameters: []
      responses:
        200:
          description: 'Password reset successful'
          content:
