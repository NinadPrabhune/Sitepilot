                email:
                  type: string
                  description: 'User email address.'
                  example: john@example.com
                password:
                  type: string
                  description: 'New password (must be confirmed).'
                  example: newpass456
                password_confirmation:
                  type: string
                  description: 'Must match the new password.'
                  example: newpass456
              required:
                - token
                - email
                - password
                - password_confirmation
