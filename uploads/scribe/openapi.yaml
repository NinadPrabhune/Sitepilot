                properties:
                  status:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: 'Password reset successful.'
        422:
          description: 'Invalid token or email'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Invalid token or email.'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Invalid token or email.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Password reset token from email.'
