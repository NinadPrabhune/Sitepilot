  /api/reports/supplier-ledger:
    get:
      summary: 'List supplier ledger transactions.'
      operationId: listSupplierLedgerTransactions
      description: "Returns transactions ordered by date (latest first) with a financial summary.\nTransactions include: Purchase Orders (`po`), Invoices (`invoice`), Payments (`payment`) and Advances (`advance`)."
      parameters:
        -
          in: query
          name: supplier_id
          description: 'optional Filter by supplier ID. Use `all` for all suppliers. Default: all.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'optional Filter by supplier ID. Use `all` for all suppliers. Default: all.'
            example: 5
        -
          in: query
          name: site_id
          description: 'optional Filter by site/project ID. Use `all` for all sites. Default: all.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'optional Filter by site/project ID. Use `all` for all sites. Default: all.'
            example: 2
        -
          in: query
          name: from_date
          description: 'date optional Start date (YYYY-MM-DD). Defaults to first day of current month.'
          example: '2025-01-01'
          required: false
          schema:
            type: string
            description: 'date optional Start date (YYYY-MM-DD). Defaults to first day of current month.'
            example: '2025-01-01'
        -
          in: query
          name: to_date
          description: 'date optional End date (YYYY-MM-DD). Defaults to today.'
          example: '2025-12-31'
          required: false
          schema:
            type: string
            description: 'date optional End date (YYYY-MM-DD). Defaults to today.'
            example: '2025-12-31'
        -
          in: query
          name: per_page
          description: 'optional Number of records per page. Default: 50.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'optional Number of records per page. Default: 50.'
            example: 50
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Supplier ledger fetched successfully.'
                  summary:
                    total_po: '100000.00'
                    total_invoice: '85000.00'
                    total_payments: '60000.00'
                    total_advances: '10000.00'
                    current_balance: '25000.00'
                    currency: INR
                  transactions:
                    -
                      id: 15
                      supplier:
                        id: 5
                        name: 'ABC Materials Ltd'
                      site:
                        id: 2
                        name: 'Main Site'
                      reference_type: invoice
                      reference_id: 12
                      debit: '25000.00'
                      credit: '0.00'
                      balance: '25000.00'
                      transaction_date: '2025-06-15'
                  pagination:
                    current_page: 1
                    per_page: 50
                    total: 85
                properties:
                  success:
                    type: boolean
                    example: true
                    description: 'Whether the request succeeded. Example: true'
                  message:
                    type: string
                    example: 'Supplier ledger fetched successfully.'
                    description: 'Response message. Example: Supplier ledger fetched successfully.'
                  summary:
                    type: object
                    properties:
                      total_po:
                        type: string
                        example: '100000.00'
                        description: 'Total purchase order amount. Example: "100000.00"'
                      total_invoice:
                        type: string
                        example: '85000.00'
                        description: 'Total invoice (debit) amount. Example: "85000.00"'
                      total_payments:
                        type: string
                        example: '60000.00'
                        description: 'Total payments and advances credited. Example: "60000.00"'
                      total_advances:
                        type: string
                        example: '10000.00'
                        description: 'Total advance amount (subset of total_payments). Example: "10000.00"'
                      current_balance:
                        type: string
                        example: '25000.00'
                        description: 'Outstanding balance across suppliers. Example: "25000.00"'
                      currency:
                        type: string
                        example: INR
                        description: 'Currency code used. Example: INR'
                    description: 'Financial summary for the filter range.'
                  transactions:
                    type: array
                    example:
                      -
                        id: 15
                        supplier:
                          id: 5
                          name: 'ABC Materials Ltd'
                        site:
                          id: 2
                          name: 'Main Site'
                        reference_type: invoice
                        reference_id: 12
                        debit: '25000.00'
                        credit: '0.00'
                        balance: '25000.00'
                        transaction_date: '2025-06-15'
                    description: 'List of transaction records.'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 15
                        supplier:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 5
                            name:
                              type: string
                              example: 'ABC Materials Ltd'
                        site:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                            name:
                              type: string
                              example: 'Main Site'
                        reference_type:
                          type: string
                          example: invoice
                        reference_id:
                          type: integer
                          example: 12
                        debit:
                          type: string
                          example: '25000.00'
                        credit:
                          type: string
                          example: '0.00'
                        balance:
                          type: string
                          example: '25000.00'
                        transaction_date:
                          type: string
                          example: '2025-06-15'
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 85
                    description: 'Laravel standard pagination meta.'
        403:
          description: 'Permission denied'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthorized action.'
                properties:
                  success:
                    type: boolean
                    example: false
                    description: 'Whether the request succeeded. Example: true'
                  message:
                    type: string
                    example: 'Unauthorized action.'
                    description: 'Response message. Example: Supplier ledger fetched successfully.'
      tags:
        - 'Supplier Ledger Report'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
