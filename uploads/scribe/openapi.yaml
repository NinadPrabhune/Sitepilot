  /api/users:
    get:
      summary: 'List Users'
      operationId: listUsers
      description: "Returns a paginated list of users. Filters by name, email, role, and workspace.\nSuper admins see only company-type users. Regular admins see only their own workspace."
      parameters:
        -
          in: query
          name: name
          description: 'optional Filter users by name (partial match).'
          example: John
          required: false
          schema:
            type: string
            description: 'optional Filter users by name (partial match).'
            example: John
        -
          in: query
          name: email
          description: 'optional Filter users by email (partial match).'
          example: john@example.com
          required: false
          schema:
            type: string
            description: 'optional Filter users by email (partial match).'
            example: john@example.com
        -
          in: query
          name: role
          description: 'optional Filter by role ID.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter by role ID.'
            example: 1
        -
          in: query
          name: workspace_id
          description: 'optional Filter by workspace ID.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter by workspace ID.'
            example: 1
        -
          in: query
          name: per_page
          description: 'optional Items per page. Defaults to 15.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'optional Items per page. Defaults to 15.'
            example: 15
      responses:
        200:
          description: 'Users retrieved successfully'
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"status\": true,\n  \"message\": \"Users retrieved successfully\",\n  \"data\": {\n    \"users\": [{ \"id\": 1, \"name\": \"John Doe\", \"email\": \"john@example.com\", ... }],\n    \"pagination\": {\n      \"current_page\": 1,\n      \"total_pages\": 5,\n      \"total_items\": 50,\n      \"per_page\": 15\n    }\n  }\n}"
        403:
          description: 'Permission denied'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Permission denied'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Permission denied'
      tags:
        - Users
    post:
      summary: 'Create User'
      operationId: createUser
      description: "Register a new user in the system. Sends a verification email if email\nverification is enabled in company settings. The user is assigned the\nrole specified by `roles`."
      parameters: []
      responses:
        201:
          description: 'User created successfully'
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"status\": true,\n  \"message\": \"User created successfully\",\n  \"data\": { \"user\": { \"id\": 3, \"name\": \"John Doe\", \"email\": \"john@example.com\", ... } }\n}"
        403:
          description: 'Permission denied or plan limit reached'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Permission denied'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Permission denied'
        422:
          description: 'Validation error'
          content:
            text/plain:
              schema:
                type: string
                example: '{ "status": false, "message": "The name field is required.", "data": {...} }'
      tags:
        - Users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'User full name.'
                  example: 'John Doe'
                email:
                  type: string
                  description: 'Unique email address.'
                  example: john@example.com
                mobile_no:
                  type: string
                  description: 'optional Mobile number.'
                  example: '+1234567890'
                password:
                  type: string
                  description: 'if password_switch=on User password (min 6 chars).'
                  example: secret123
                password_switch:
                  type: string
                  description: 'optional Enable password-based login. Accepts "on".'
                  example: 'on'
                roles:
                  type: integer
                  description: 'Role ID to assign.'
                  example: 1
                avatar:
                  type: string
                  format: binary
                  description: 'optional Profile image (jpeg/png/jpg/gif, max 2 MB).'
                workspace_id:
                  type: integer
                  description: 'optional Workspace ID.'
                  example: 1
              required:
                - name
                - email
                - password
                - roles
