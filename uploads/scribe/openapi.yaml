components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Use Laravel Sanctum Bearer token. Authenticate via /api/login endpoint to get your token.'
security:
  -
    default: []
paths:
  /api/activities:
    get:
      summary: 'List Activities'
      operationId: listActivities
      description: 'Retrieve a list of all activities with optional filtering by workspace and site. Returns activities separated into pending and completed categories with completion percentages.'
      parameters:
        -
          in: query
          name: workspace_id
          description: 'optional Filter by workspace ID.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Filter by workspace ID.'
            example: 1
        -
          in: query
          name: site_id
          description: 'optional Filter by site/project ID.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'optional Filter by site/project ID.'
            example: 5
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"data":{"pending":[...],"completed":[...]}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to fetch activities.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch activities.'
      tags:
        - Activities
    post:
      summary: 'Create Activity'
      operationId: createActivity
      description: 'Create a new activity in the system with assigned users, timeline, quantity tracking, and optional reference file.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status": true, "message": "Activity created successfully", "data": {...}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Total completed quantity cannot exceed the main quantity.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Total completed quantity cannot exceed the main quantity.'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to create activity'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to create activity'
      tags:
        - Activities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                assign_to:
                  type: array
                  description: 'Array of user IDs to assign.'
                  example:
                    - 1
                    - 2
                    - 3
                  items:
                    type: string
                title:
                  type: string
                  description: 'Activity title.'
                  example: 'Foundation work'
                start_date:
                  type: date
                  description: 'Start date.'
                  example: '2024-01-01'
                due_date:
                  type: date
                  description: 'Due date.'
                  example: '2024-01-31'
                scope:
                  type: string
                  description: 'Activity scope/description.'
                  example: 'Building foundation for block A'
                quantity:
                  type: integer
                  description: 'Total quantity.'
                  example: 100
                unit:
                  type: string
                  description: 'Unit of measurement.'
                  example: sqft
                priority:
                  type: string
                  description: 'Priority level (low, medium, high).'
                  example: high
                completed_quantity:
                  type: integer
                  description: 'optional Initial completed quantity.'
                  example: 0
                created_by:
                  type: integer
                  description: 'Creator user ID.'
                  example: 1
                workspace_id:
                  type: integer
                  description: 'Workspace ID.'
                  example: 1
                site_id:
                  type: integer
                  description: 'Site/Project ID.'
                  example: 5
                reference_file:
                  type: string
                  format: binary
                  description: 'optional Reference document (max 20MB, allowed: pdf,doc,docx,jpg,jpeg,png,xls,xlsx).'
              required:
                - assign_to
                - title
                - start_date
                - due_date
                - scope
                - quantity
                - unit
                - priority
                - created_by
                - workspace_id
                - site_id
  '/api/activities/{id}':
    get:
      summary: 'Show Activity Details'
      operationId: showActivityDetails
      description: 'Retrieve detailed information about a specific activity including completion data, manpowers, daily progress, consumptions, and assigned users.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"data":{"id":10,"title":"Foundation work","scope":"...","quantity":100,"unit":"sqft","priority":"high","status":"pending","completed_qty":25,"completion_percentage":25,"is_completed":false,"workspace":{...},"site":{...},"completeds":[...],"manpowers":[...],"daily_progress":[...],"consumptions":[...],"reference_file":"...","assign_to":[...]}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to fetch activity.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch activity.'
      tags:
        - Activities
    put:
      summary: 'Update Activity'
      operationId: updateActivity
      description: "Update an existing activity's details and manage its completion records. Supports updating both the main activity and individual completion entries with file uploads."
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"message":"Activity updated successfully","data":{...}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Total completed quantity cannot exceed the main quantity.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Total completed quantity cannot exceed the main quantity.'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to update activity'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to update activity'
      tags:
        - Activities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                assign_to:
                  type: required
                  description: 'Array of user IDs or comma-separated string.'
                  example: '[1, 2, 3]'
                title:
                  type: string
                  description: 'Activity title.'
                  example: 'Foundation work'
                start_date:
                  type: date
                  description: 'Start date.'
                  example: '2024-01-01'
                due_date:
                  type: date
                  description: 'Due date.'
                  example: '2024-01-31'
                scope:
                  type: string
                  description: 'Activity scope/description.'
                  example: 'Building foundation for block A'
                quantity:
                  type: integer
                  description: 'Total quantity.'
                  example: 100
                unit:
                  type: string
                  description: 'Unit of measurement.'
                  example: sqft
                priority:
                  type: string
                  description: 'Priority level (low, medium, high).'
                  example: high
                completed_quantity:
                  type: integer
                  description: 'optional Initial completed quantity (legacy format).'
                  example: 0
                created_by:
                  type: integer
                  description: 'Creator user ID.'
                  example: 1
                workspace_id:
                  type: integer
                  description: 'Workspace ID.'
                  example: 1
                site_id:
                  type: integer
                  description: 'Site/Project ID.'
                  example: 5
                activity_id:
                  type: integer
                  description: 'Activity ID.'
                  example: 10
                status:
                  type: string
                  description: 'optional Activity status.'
                  example: pending
                activities_completed:
                  type: array
                  description: 'optional Array of completion records to update/create.'
                  example:
                    -
                      id: 1
                      completed_quantity: 25
                      completed_date: '2024-01-15'
                  items:
                    type: string
                reference_file:
                  type: string
                  format: binary
                  description: 'optional Reference document for activity (max 20MB, allowed: pdf,doc,docx,jpg,jpeg,png,xls,xlsx).'
              required:
                - title
                - start_date
                - due_date
                - scope
                - quantity
                - unit
                - priority
                - created_by
                - workspace_id
                - site_id
                - activity_id
    delete:
      summary: 'Delete Activity'
      operationId: deleteActivity
      description: 'Delete an activity from the system. Note: Completion records linked to ManPower, DPR, and Consumption are preserved for historical records.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'Activity deleted successfully'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Activity deleted successfully'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to delete activity'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to delete activity'
      tags:
        - Activities
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the activity.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: activity
        description: 'The activity ID.'
        example: '10'
        required: true
        schema:
          type: string
  /api/activities/create-data:
    post:
      summary: 'Get Activity Creation Form Data'
      operationId: getActivityCreationFormData
      description: 'Retrieve metadata required for the activity creation form including workspaces, sites, priorities, and available users.'
      parameters:
        -
          in: query
          name: workspace_id
          description: 'optional Workspace ID to filter sites.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Workspace ID to filter sites.'
            example: 1
        -
          in: query
          name: site_id
          description: 'optional Site ID.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'optional Site ID.'
            example: 5
        -
          in: query
          name: created_by
          description: 'optional Creator user ID.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'optional Creator user ID.'
            example: 1
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"message":"Form metadata fetched successfully","workspaces":[...],"sites":[...],"priorities":[...],"users":[...]}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to fetch form metadata'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch form metadata'
      tags:
        - Activities
  /api/activities/progress/create:
    get:
      summary: 'Get Progress Creation Form Data'
      operationId: getProgressCreationFormData
      description: 'Retrieve metadata required for creating activity progress including workspaces, sites, activities, and already completed quantities.'
      parameters:
        -
          in: query
          name: workspace_id
          description: 'Workspace ID.'
          example: 1
          required: true
          schema:
            type: integer
            description: 'Workspace ID.'
            example: 1
        -
          in: query
          name: site_id
          description: 'Site/Project ID.'
          example: 5
          required: true
          schema:
            type: integer
            description: 'Site/Project ID.'
            example: 5
        -
          in: query
          name: activity_id
          description: 'Activity ID.'
          example: 10
          required: true
          schema:
            type: integer
            description: 'Activity ID.'
            example: 10
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"message":"Progress data fetched successfully","workspaces":[...],"sites":[...],"priorities":[...],"activities":[...],"alreadyCompleted":50}'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to fetch progress data'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to fetch progress data'
      tags:
        - Activities
  /api/activities/progress/store:
    post:
      summary: 'Store Activity Progress'
      operationId: storeActivityProgress
      description: 'Record progress for an activity by adding completed quantity with optional reference file. Validates that total completed does not exceed activity quantity.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '{"status":true,"message":"Progress stored successfully","data":{...}}'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 0
                  message: 'Permission denied'
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 'Permission denied'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Total completed quantity cannot exceed the main quantity.'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Total completed quantity cannot exceed the main quantity.'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: false
                  message: 'Failed to store progress'
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to store progress'
      tags:
        - Activities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                workspace_id:
                  type: integer
                  description: 'Workspace ID.'
                  example: 1
                site_id:
                  type: integer
                  description: 'Site/Project ID.'
                  example: 5
                activity_id:
                  type: integer
                  description: 'Activity ID.'
                  example: 10
                completed_quantity:
                  type: integer
                  description: 'Quantity completed in this entry.'
                  example: 25
                date:
                  type: date
                  description: 'Date of completion.'
                  example: '2024-01-15'
                created_by:
                  type: integer
                  description: 'optional Creator user ID.'
                  example: 1
                completed_reference_file:
                  type: string
                  format: binary
                  description: 'optional Reference document for this progress (max 20MB, allowed: pdf,doc,docx,jpg,jpeg,png,xls,xlsx).'
              required:
                - workspace_id
                - site_id
                - activity_id
                - completed_quantity
                - date
  /api/app-info:
    get:
      summary: 'Get the list of app information.'
      operationId: getTheListOfAppInformation
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The route api/app-info could not be found.'
                properties:
                  message:
                    type: string
                    example: 'The route api/app-info could not be found.'
      tags:
        - 'App Info'
    post:
      summary: ''
      operationId: postApiAppInfo
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'App Info'
  '/api/app-info/{id}':
    get:
      summary: 'Display the specified app information.'
      operationId: displayTheSpecifiedAppInformation
      description: ''
      parameters: []
      responses:
        404:
          description: ''
